<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Connexion – BornISLog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

    <header>
        <img src="{{ url_for('static', filename='images/LogoOmexom.jpg') }}" alt="Logo">
        <h1 class="titre">BornISLog</h1>
    </header>

    <main>
        <section class="carte-login" aria-labelledby="login-titre">

            <h2 id="login-titre">
                <span class="login-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                         stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                        <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                    </svg>
                </span>
                Connexion
            </h2>
            <p class="sous-titre">Connectez-vous pour accéder à la supervision des bornes.</p>

            <!-- Message d'erreur : rempli par Flask (identifiants refusés) ou par login.js -->
            <div class="message-erreur" id="login-erreur" role="alert" {% if not erreur %}hidden{% endif %}>{{ erreur }}</div>

            <form id="login-form" method="post" action="/login" novalidate>
                {# Si tu utilises Flask-WTF / CSRFProtect, décommente la ligne suivante :
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"> #}
                <input type="hidden" name="next" value="{{ next or '' }}">

                <div class="champ">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username"
                           autocomplete="username" autocapitalize="none" spellcheck="false"
                           required autofocus>
                </div>

                <div class="champ">
                    <label for="password">Mot de passe</label>
                    <div class="champ-mdp">
                        <input type="password" id="password" name="password"
                               autocomplete="current-password" required>
                        <button type="button" class="mdp-toggle" id="mdp-toggle"
                                aria-label="Afficher le mot de passe" aria-pressed="false"
                                title="Afficher / masquer le mot de passe">
                            <svg class="oeil" viewBox="0 0 24 24" width="20" height="20" fill="none"
                                 stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <line class="barre" x1="4" y1="4" x2="20" y2="20"></line>
                            </svg>
                        </button>
                    </div>
                    <p class="avertissement-maj" id="maj-avertissement" hidden>Verrouillage majuscules activé</p>
                </div>

                <button type="submit" class="button btn-connexion" id="btn-connexion">
                    <span class="btn-texte">Se connecter</span>
                    <span class="spinner" aria-hidden="true"></span>
                </button>
            </form>

            <p class="pied-carte">Accès réservé au personnel autorisé.</p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
